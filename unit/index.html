<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIT — franchise, everywhere</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#120705;cursor:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff;font-family:"Archivo",sans-serif}
.ui a{color:inherit;text-decoration:none;pointer-events:auto}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:30px 44px;font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:600}.top .grp{display:flex;gap:28px}
.logo{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-family:"Archivo Black",sans-serif;font-size:23px;letter-spacing:.3em;color:#ffb43b}
.center{position:absolute;left:44px;bottom:118px;mix-blend-mode:screen}
.center h1{font-family:"Archivo Black",sans-serif;font-size:clamp(52px,11vw,180px);line-height:.84;text-transform:uppercase}
.center h1 span{color:#ff9d1e}
.tagline{position:absolute;left:44px;bottom:80px;font-weight:700;font-size:12px;letter-spacing:.36em;text-transform:uppercase;opacity:.9}
.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:32px 44px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;opacity:.85}
.cursor{position:fixed;z-index:20;width:11px;height:11px;border-radius:50%;background:#ffb43b;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 24px 6px rgba(255,160,40,.6)}
</style></head><body>
<canvas id="gl"></canvas>
<div class="ui"><div class="logo">UNIT</div>
<div class="top"><div class="grp"><a href="#">Menu</a><a href="#">Locations</a></div><div class="grp"><a href="#">Franchise</a><a href="#">Order</a></div></div>
<div class="center"><h1>every<br><span>block.</span></h1></div>
<div class="tagline">120+ stores · one signature</div>
<div class="bottom"><div>Store N°001 · Signature Stack</div><div>Move — ripple the grid</div></div></div>
<div class="cursor" id="cur"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uTex:{value:null},uMouse:{value:new THREE.Vector2(.5,.5)},uMV:{value:0},uTime:{value:0},uPA:{value:1},uIA:{value:1.5}};
const frag=`precision highp float;varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uMouse;uniform float uMV,uTime,uPA,uIA;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
void main(){vec2 uv=vUv;float rp=uPA,ri=uIA;if(rp>ri)uv.y=(uv.y-.5)*(ri/rp)+.5;else uv.x=(uv.x-.5)*(rp/ri)+.5;
 // mosaic tile grid that ripples & pops from cursor
 float N=14.0;vec2 gv=vec2(N*uPA,N);vec2 cell=(floor(vUv*gv)+0.5)/gv;
 float cd=distance(cell*vec2(uPA,1.),uMouse*vec2(uPA,1.));
 float wave=sin(cd*12.0-uTime*3.5);
 float pop=smoothstep(0.5,0.0,cd)*(0.5+0.5*wave);
 // per-tile offset (flip/scale toward cursor)
 vec2 local=fract(vUv*gv)-0.5;
 float sc=1.0-pop*0.16*(0.6+uMV*2.0);
 vec2 tuv=cell+ (local/gv)*sc*2.0;
 tuv+=normalize(cell-uMouse+1e-4)*pop*0.012;
 vec3 col=texture2D(uTex,tuv).rgb;
 // tile seams + energy glow
 vec2 g=abs(local);float seam=smoothstep(0.46,0.5,max(g.x,g.y));
 col*=1.0-seam*0.5;
 col+=vec3(1.0,0.62,0.12)*pop*0.22;
 col=(col-0.5)*1.12+0.5;col=mix(col,col*vec3(1.08,0.98,0.94),0.4);
 float vig=smoothstep(1.25,0.3,distance(vUv,vec2(.5)));col*=0.76+0.24*vig;
 col+=(hash(vUv*1000.+uTime)-.5)*0.05;gl_FragColor=vec4(col,1.);}`;
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,fragmentShader:frag});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
new THREE.TextureLoader().load('set_franchise.webp',t=>{t.minFilter=t.magFilter=THREE.LinearFilter;U.uTex.value=t;U.uIA.value=t.image.width/t.image.height;});
function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);U.uPA.value=w/h;}addEventListener('resize',rs);rs();
let tx=.5,ty=.5,mx=.5,my=.5,lx=.5,ly=.5;const cur=document.getElementById('cur');
addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});addEventListener('touchstart',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});
const clk=new THREE.Clock();(function l(){requestAnimationFrame(l);mx+=(tx-mx)*.1;my+=(ty-my)*.1;const v=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;U.uMouse.value.set(mx,my);U.uMV.value+=(Math.min(v*9,1)-U.uMV.value)*.11;U.uTime.value=clk.getElapsedTime();renderer.render(scene,camera);})();
</script></body></html>
