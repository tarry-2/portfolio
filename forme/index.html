<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORME — in motion</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=Bodoni+Moda:ital,wght@1,400;0,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0b0b0d;cursor:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#f4f2ef;font-family:"Archivo",sans-serif;font-weight:300;mix-blend-mode:difference}
.ui a{color:inherit;text-decoration:none;pointer-events:auto}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:32px 44px;font-size:12px;letter-spacing:.32em;text-transform:uppercase}.top .grp{display:flex;gap:30px}
.logo{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-family:"Bodoni Moda",serif;font-weight:600;font-size:24px;letter-spacing:.4em}
.center{position:absolute;right:44px;bottom:110px;text-align:right}
.center h1{font-family:"Bodoni Moda",serif;font-style:italic;font-size:clamp(48px,9vw,140px);line-height:.86}
.center p{margin-top:18px;font-size:12px;letter-spacing:.34em;text-transform:uppercase;opacity:.8}
.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:34px 44px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.85}
.cursor{position:fixed;z-index:20;width:10px;height:10px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:difference}
</style></head><body>
<canvas id="gl"></canvas>
<div class="ui"><div class="logo">FORME</div>
<div class="top"><div class="grp"><a href="#">Collection</a><a href="#">Runway</a></div><div class="grp"><a href="#">Stores</a><a href="#">Bag (0)</a></div></div>
<div class="center"><h1>wear the<br>motion.</h1><p>FW26 · Sculpted in fabric</p></div>
<div class="bottom"><div>Look N°01 · The Draped Suit</div><div>Move — ripple the fabric</div></div></div>
<div class="cursor" id="cur"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uTex:{value:null},uMouse:{value:new THREE.Vector2(.5,.5)},uMV:{value:0},uTime:{value:0},uPA:{value:1},uIA:{value:1.5}};
const frag=`precision highp float;varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uMouse;uniform float uMV,uTime,uPA,uIA;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
void main(){vec2 uv=vUv;float rp=uPA,ri=uIA;if(rp>ri)uv.y=(uv.y-.5)*(ri/rp)+.5;else uv.x=(uv.x-.5)*(rp/ri)+.5;
 vec2 md=(vUv-uMouse)*vec2(uPA,1.0);float dist=length(md);float infl=smoothstep(0.4,0.,dist);
 // flowing fabric: layered wave, billows as cursor moves
 float flow=0.5+uMV*3.0;
 uv.x+=sin(uv.y*10.0 + uTime*1.4)*0.006*flow;
 uv.y+=sin(uv.x*7.0 - uTime*1.0)*0.004*flow;
 uv.x+=sin(uv.y*22.0 - uTime*2.2)*0.0022*flow;
 // cursor drags the cloth
 vec2 dir=normalize(vUv-uMouse+1e-4);uv+=dir*infl*0.028*(uMV*3.0);
 // slick chromatic split (editorial)
 float ca=0.006*(0.3+uMV*1.5)+infl*0.004;
 vec3 col;col.r=texture2D(uTex,uv+vec2(ca,ca*0.4)).r;col.g=texture2D(uTex,uv).g;col.b=texture2D(uTex,uv-vec2(ca,ca*0.4)).b;
 col=(col-0.5)*1.08+0.5;
 float vig=smoothstep(1.25,0.35,distance(vUv,vec2(.5)));col*=0.82+0.18*vig;
 col+=(hash(vUv*950.+uTime)-.5)*0.035;gl_FragColor=vec4(col,1.);}`;
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,fragmentShader:frag});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
new THREE.TextureLoader().load('set_fashion.webp',t=>{t.minFilter=t.magFilter=THREE.LinearFilter;U.uTex.value=t;U.uIA.value=t.image.width/t.image.height;});
function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);U.uPA.value=w/h;}addEventListener('resize',rs);rs();
let tx=.5,ty=.5,mx=.5,my=.5,lx=.5,ly=.5;const cur=document.getElementById('cur');
addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});addEventListener('touchstart',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});
const clk=new THREE.Clock();(function l(){requestAnimationFrame(l);mx+=(tx-mx)*.08;my+=(ty-my)*.08;const v=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;U.uMouse.value.set(mx,my);U.uMV.value+=(Math.min(v*9,1)-U.uMV.value)*.1;U.uTime.value=clk.getElapsedTime();renderer.render(scene,camera);})();
</script></body></html>
