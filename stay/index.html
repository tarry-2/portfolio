<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAY — a quiet escape</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=Bodoni+Moda:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0d1213;cursor:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#f2f5f3;font-family:"Archivo",sans-serif;font-weight:300;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.ui a{color:inherit;text-decoration:none;pointer-events:auto}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:32px 44px;font-size:12px;letter-spacing:.3em;text-transform:uppercase}.top .grp{display:flex;gap:30px}
.logo{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-family:"Bodoni Moda",serif;font-style:italic;font-size:26px;letter-spacing:.18em}
.center{position:absolute;left:44px;top:50%;transform:translateY(-50%)}
.center .k{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#a9c4b8;margin-bottom:18px}
.center h1{font-family:"Bodoni Moda",serif;font-style:italic;font-size:clamp(46px,8vw,120px);line-height:.92}
.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:34px 44px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.8}
.cursor{position:fixed;z-index:20;width:38px;height:38px;border:1px solid rgba(242,245,243,.45);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
</style></head><body>
<canvas id="gl"></canvas>
<div class="ui"><div class="logo">STAY</div>
<div class="top"><div class="grp"><a href="#">Rooms</a><a href="#">The Place</a></div><div class="grp"><a href="#">Book</a><a href="#">Contact</a></div></div>
<div class="center"><div class="k">Private pension · in the mountains</div><h1>breathe,<br>slowly.</h1></div>
<div class="bottom"><div>Villa N°01 · Lakeside Deck</div><div>Move — drift through the mist</div></div></div>
<div class="cursor" id="cur"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uTex:{value:null},uMouse:{value:new THREE.Vector2(.5,.5)},uMV:{value:0},uTime:{value:0},uPA:{value:1},uIA:{value:1.5}};
const frag=`precision highp float;varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uMouse;uniform float uMV,uTime,uPA,uIA;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.;a*=.5;}return v;}
void main(){vec2 uv=vUv;float rp=uPA,ri=uIA;if(rp>ri)uv.y=(uv.y-.5)*(ri/rp)+.5;else uv.x=(uv.x-.5)*(rp/ri)+.5;
 // depth parallax: gentle lean, foreground moves more than sky
 vec2 par=(uMouse-0.5);
 float depth=mix(0.045,0.012,uv.y); // bottom(near) shifts more
 uv-=par*depth;
 uv.x+=sin(uTime*0.1)*0.002; // slow idle drift
 vec3 col=texture2D(uTex,uv).rgb;
 // drifting mist across the mid-water
 float mist=fbm(vec2(vUv.x*2.6 - uTime*0.05, vUv.y*2.0 + uTime*0.02));
 float band=smoothstep(0.30,0.55,vUv.y)*smoothstep(0.72,0.5,vUv.y);
 col=mix(col,col+vec3(0.88,0.92,0.95),mist*0.18*band + mist*0.05);
 float vig=smoothstep(1.25,0.4,distance(vUv,vec2(.5)));col*=0.86+0.14*vig;
 col=mix(col,col*vec3(0.98,1.0,1.02),0.3);
 col+=(hash(vUv*880.+uTime)-.5)*0.028;gl_FragColor=vec4(col,1.);}`;
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,fragmentShader:frag});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
new THREE.TextureLoader().load('set_pension.webp',t=>{t.minFilter=t.magFilter=THREE.LinearFilter;U.uTex.value=t;U.uIA.value=t.image.width/t.image.height;});
function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);U.uPA.value=w/h;}addEventListener('resize',rs);rs();
let tx=.5,ty=.5,mx=.5,my=.5,lx=.5,ly=.5;const cur=document.getElementById('cur');
addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});addEventListener('touchstart',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});
const clk=new THREE.Clock();(function l(){requestAnimationFrame(l);mx+=(tx-mx)*.05;my+=(ty-my)*.05;const v=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;U.uMouse.value.set(mx,my);U.uMV.value+=(Math.min(v*8,1)-U.uMV.value)*.08;U.uTime.value=clk.getElapsedTime();renderer.render(scene,camera);})();
</script></body></html>
