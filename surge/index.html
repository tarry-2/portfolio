<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURGE — pure energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0003;cursor:none}
  .bgfill{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(34px) brightness(.5) saturate(1.1);transform:scale(1.15)}#gl{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;display:block}
  .ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff;font-family:"Archivo",sans-serif}
  .ui a{color:inherit;text-decoration:none;pointer-events:auto}
  .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:30px 44px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:600}
  .top .grp{display:flex;gap:30px}
  .logo{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-family:"Archivo Black",sans-serif;font-size:24px;letter-spacing:.24em;color:#ff2d3f;text-shadow:0 0 30px rgba(255,45,63,.6)}
  .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;width:100%;mix-blend-mode:screen}
  .center h1{font-family:"Archivo Black",sans-serif;font-size:clamp(58px,13vw,220px);line-height:.82;letter-spacing:-.02em;text-transform:uppercase}
  .center h1 span{color:#ff2d3f}
  .tagline{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);font-weight:700;font-size:13px;letter-spacing:.4em;text-transform:uppercase;opacity:.9}
  .bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:34px 44px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:600;opacity:.9}
  .cursor{position:fixed;z-index:20;width:10px;height:10px;border-radius:50%;background:#ff2d3f;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 24px 6px rgba(255,45,63,.7)}
  @media(max-width:700px){.top{padding:18px}.bottom{padding:20px}.grp{gap:14px}.tagline{bottom:90px}}
</style>
</head>
<body>
<div class="bgfill" id="bgfill"></div><canvas id="gl"></canvas>
<div class="ui">
  <div class="logo">SURGE</div>
  <div class="top"><div class="grp"><a href="#">Drinks</a><a href="#">Energy</a></div><div class="grp"><a href="#">Find Us</a><a href="#">Cart (0)</a></div></div>
  <div class="center"><h1>un<span>leash</span></h1></div>
  <div class="tagline">explosive cola · caffeine loaded</div>
  <div class="bottom"><div>N°01 · Original Blast</div><div>Move fast — make it splash</div></div>
</div>
<div class="cursor" id="cur"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uTex:{value:null},uMouse:{value:new THREE.Vector2(.5,.5)},uMV:{value:0},uTime:{value:0},uPA:{value:1},uIA:{value:1.5}};
const vert=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`;
const frag=`precision highp float;varying vec2 vUv;
uniform sampler2D uTex;uniform vec2 uMouse;uniform float uMV,uTime,uPA,uIA;
float hash(float n){return fract(sin(n)*43758.5453);}
float grain(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
// bursting bubbles radiating from cursor
float burst(vec2 uv,vec2 m,float t,float mv){
  float acc=0.0;vec2 p=(uv-m)*vec2(uPA,1.0);float ang=atan(p.y,p.x);float rad=length(p);
  for(int i=0;i<20;i++){float fi=float(i);
    float a=hash(fi*2.1)*6.28;float life=fract(t*0.9+hash(fi*4.4));
    float rr=life*0.32*(0.4+mv*2.5);
    vec2 bp=vec2(cos(a),sin(a))*rr;
    float r=0.004*(1.0-life);
    float d=distance(p,bp);
    acc+=smoothstep(r,0.0,d)*(1.0-life)*(0.4+mv*2.0);
  }
  return acc;
}
void main(){
  vec2 uv=vUv;float rp=uPA,ri=uIA;
  if(rp>ri)uv.y=(uv.y-0.5)*(ri/rp)+0.5;else uv.x=(uv.x-0.5)*(rp/ri)+0.5;
  float d=distance(vUv*vec2(uPA,1.0),uMouse*vec2(uPA,1.0));
  float infl=smoothstep(0.42,0.0,d);
  // strong energetic ripple (splash stays alive)
  vec2 dir=normalize(vUv-uMouse+1e-4);
  float rip=sin(d*26.0-uTime*6.0);
  uv+=dir*rip*0.020*infl*(0.6+uMV*4.0);
  uv.x+=sin(uv.y*20.0+uTime*1.4)*0.0026;
  // chromatic splash
  float ca=0.006*(infl+uMV*0.5);
  vec3 col;col.r=texture2D(uTex,uv+vec2(ca,ca*0.3)).r;col.g=texture2D(uTex,uv).g;col.b=texture2D(uTex,uv-vec2(ca,ca*0.3)).b;
  // bursting carbonation at cursor
  float bb=burst(vUv,uMouse,uTime,uMV+0.15);
  col+=vec3(1.0,0.85,0.7)*bb*1.2;
  // red energy glow that pulses & follows cursor
  float pulse=0.5+0.5*sin(uTime*2.2);
  col+=vec3(1.0,0.1,0.18)*infl*(0.18+0.12*pulse);
  col*=1.0+infl*0.15;
  // punchy contrast grade
  col=(col-0.5)*1.12+0.5;
  col=mix(col,col*vec3(1.08,0.98,0.98),0.4);
  float vig=smoothstep(1.25,0.3,distance(vUv,vec2(0.5)));col*=0.74+0.26*vig;
  col+=(grain(vUv*vec2(1000.,600.)+uTime)-0.5)*0.05;
  gl_FragColor=vec4(col,1.);
}`;
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:vert,fragmentShader:frag});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
new THREE.TextureLoader().load('cola_b.webp',t=>{t.minFilter=t.magFilter=THREE.LinearFilter;U.uTex.value=t;U.uIA.value=t.image.width/t.image.height;var _b=document.getElementById("bgfill");if(_b)_b.style.backgroundImage="url("+t.image.src+")";rs();});
function rs(){const vw=innerWidth,vh=innerHeight,ia=U.uIA.value||1216/832;let w=vw,h=vh;if(vw/vh<ia){w=vw;h=Math.round(vw/ia);}renderer.setSize(w,h);renderer.domElement.style.width=w+"px";renderer.domElement.style.height=h+"px";U.uPA.value=w/h;}addEventListener('resize',rs);rs();
let tx=.5,ty=.5,mx=.5,my=.5,lx=.5,ly=.5;const cur=document.getElementById('cur');
addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});addEventListener('touchstart',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});
const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);mx+=(tx-mx)*.1;my+=(ty-my)*.1;const v=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;U.uMouse.value.set(mx,my);U.uMV.value+=(Math.min(v*10,1)-U.uMV.value)*.12;U.uTime.value=clk.getElapsedTime();renderer.render(scene,camera);})();
</script>
</body>
</html>
