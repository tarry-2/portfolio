<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISE — chef's meal kit</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;600;700&family=Bodoni+Moda:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#14100c;cursor:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#f6efe4;font-family:"Archivo",sans-serif;font-weight:300}
.ui a{color:inherit;text-decoration:none;pointer-events:auto}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:32px 44px;font-size:12px;letter-spacing:.28em;text-transform:uppercase}.top .grp{display:flex;gap:30px}
.logo{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-weight:700;font-size:22px;letter-spacing:.46em}
.center{position:absolute;left:44px;bottom:120px}
.center .k{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#e8a06a;margin-bottom:16px}
.center h1{font-family:"Bodoni Moda",serif;font-style:italic;font-size:clamp(44px,8vw,120px);line-height:.9}
.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:34px 44px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.8}
.cursor{position:fixed;z-index:20;width:9px;height:9px;border-radius:50%;background:#ffb877;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 20px 5px rgba(255,150,80,.5)}
</style></head><body>
<canvas id="gl"></canvas>
<div class="ui"><div class="logo">MISE</div>
<div class="top"><div class="grp"><a href="#">Menus</a><a href="#">This Week</a></div><div class="grp"><a href="#">Subscribe</a><a href="#">Cart (0)</a></div></div>
<div class="center"><div class="k">Chef's Meal Kit · Delivered fresh</div><h1>cook it<br>like fire.</h1></div>
<div class="bottom"><div>Menu N°01 · Prime Rib & Garden</div><div>Move — feel the heat rise</div></div></div>
<div class="cursor" id="cur"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uTex:{value:null},uMouse:{value:new THREE.Vector2(.5,.5)},uMV:{value:0},uTime:{value:0},uPA:{value:1},uIA:{value:1.5}};
const frag=`precision highp float;varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uMouse;uniform float uMV,uTime,uPA,uIA;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p*=2.;a*=.5;}return v;}
void main(){vec2 uv=vUv;float rp=uPA,ri=uIA;if(rp>ri)uv.y=(uv.y-.5)*(ri/rp)+.5;else uv.x=(uv.x-.5)*(rp/ri)+.5;
 vec2 dir=normalize(vUv-uMouse+1e-4);float dist=distance(vUv*vec2(uPA,1.),uMouse*vec2(uPA,1.));float infl=smoothstep(0.32,0.,dist);
 // sizzling warp near cursor (ingredients jump)
 uv+=dir*sin(dist*24.-uTime*5.)*0.012*infl*(0.5+uMV*3.);
 vec3 col=texture2D(uTex,uv).rgb;
 // rising steam: fbm scrolling upward, stronger toward top
 float st=fbm(vec2(vUv.x*3.5, vUv.y*4.0 - uTime*0.35));
 st=smoothstep(0.45,0.9,st)*smoothstep(0.05,0.85,vUv.y);
 col=mix(col,col+vec3(0.95,0.9,0.85),st*0.16);
 col*=1.0+infl*0.14;
 col=(col-0.5)*1.06+0.5;col=mix(col,col*vec3(1.06,1.0,0.94),0.35);
 float vig=smoothstep(1.2,0.35,distance(vUv,vec2(.5)));col*=0.8+0.2*vig;
 col+=(hash(vUv*900.+uTime)-.5)*0.04;gl_FragColor=vec4(col,1.);}`;
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,fragmentShader:frag});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
new THREE.TextureLoader().load('set_mealkit.webp',t=>{t.minFilter=t.magFilter=THREE.LinearFilter;U.uTex.value=t;U.uIA.value=t.image.width/t.image.height;});
function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);U.uPA.value=w/h;}addEventListener('resize',rs);rs();
let tx=.5,ty=.5,mx=.5,my=.5,lx=.5,ly=.5;const cur=document.getElementById('cur');
addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
const clk=new THREE.Clock();(function l(){requestAnimationFrame(l);mx+=(tx-mx)*.09;my+=(ty-my)*.09;const v=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;U.uMouse.value.set(mx,my);U.uMV.value+=(Math.min(v*9,1)-U.uMV.value)*.11;U.uTime.value=clk.getElapsedTime();renderer.render(scene,camera);})();
</script></body></html>
