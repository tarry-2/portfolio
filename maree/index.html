<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARÉE — daily catch</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600&family=Bodoni+Moda:ital@1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#071016;cursor:none}
.bgfill{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(34px) brightness(.5) saturate(1.1);transform:scale(1.15)}#gl{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;display:block}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#eaf6fb;font-family:"Archivo",sans-serif;font-weight:300}
.ui a{color:inherit;text-decoration:none;pointer-events:auto}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:32px 44px;font-size:12px;letter-spacing:.3em;text-transform:uppercase}.top .grp{display:flex;gap:30px}
.logo{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-family:"Bodoni Moda",serif;font-style:italic;font-size:26px;letter-spacing:.16em}
.center{position:absolute;left:44px;top:50%;transform:translateY(-50%)}
.center .k{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:#5fc7e8;margin-bottom:16px}
.center h1{font-family:"Bodoni Moda",serif;font-style:italic;font-size:clamp(46px,8vw,124px);line-height:.9}
.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:34px 44px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.8}
.cursor{position:fixed;z-index:20;width:9px;height:9px;border-radius:50%;background:#8fe3ff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 22px 6px rgba(120,220,255,.55)}
</style></head><body>
<a href="../#work" aria-label="포트폴리오로 돌아가기" style="position:fixed;top:18px;left:18px;z-index:9999;display:inline-flex;align-items:center;gap:7px;padding:9px 15px 9px 12px;font-family:Archivo,system-ui,sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#fff;text-decoration:none;background:rgba(20,18,22,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:100px;cursor:pointer;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.3)">← Works</a>
<a href="../#work" aria-label="닫기" style="position:fixed;top:18px;right:18px;z-index:9999;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;font-family:Archivo,system-ui,sans-serif;font-size:18px;line-height:1;color:#fff;text-decoration:none;background:rgba(20,18,22,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);border-radius:50%;cursor:pointer;pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.3)">✕</a>
<div class="bgfill" id="bgfill"></div><canvas id="gl"></canvas>
<div class="ui"><div class="logo">MARÉE</div>
<div class="top"><div class="grp"><a href="#">Today's Catch</a><a href="#">Seasons</a></div><div class="grp"><a href="#">Order</a><a href="#">Cart (0)</a></div></div>
<div class="center"><div class="k">Live from the harbor · same-day</div><h1>straight<br>from the<br>sea.</h1></div>
<div class="bottom"><div>Lot N°01 · Snow Crab & Catch</div><div>Move — make it splash</div></div></div>
<div class="cursor" id="cur"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uTex:{value:null},uMouse:{value:new THREE.Vector2(.5,.5)},uMV:{value:0},uTime:{value:0},uPA:{value:1},uIA:{value:1.5}};
const frag=`precision highp float;varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uMouse;uniform float uMV,uTime,uPA,uIA;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
void main(){vec2 uv=vUv;float rp=uPA,ri=uIA;if(rp>ri)uv.y=(uv.y-.5)*(ri/rp)+.5;else uv.x=(uv.x-.5)*(rp/ri)+.5;
 vec2 dir=normalize(vUv-uMouse+1e-4);float dist=distance(vUv*vec2(uPA,1.),uMouse*vec2(uPA,1.));float infl=smoothstep(0.4,0.,dist);
 // concentric water ripples radiating from cursor (splash)
 uv+=dir*sin(dist*34.-uTime*7.)*0.016*infl*(0.5+uMV*3.5);
 uv.x+=sin(uv.y*18.+uTime*1.2)*0.0024;
 float ca=0.005*(infl+uMV*0.4);vec3 col;col.r=texture2D(uTex,uv+vec2(ca,0.)).r;col.g=texture2D(uTex,uv).g;col.b=texture2D(uTex,uv-vec2(ca,0.)).b;
 // cold shimmer + droplet sparkle
 float shim=sin(uv.x*44.+uTime*2.)*sin(uv.y*44.-uTime*1.6);
 col+=vec3(0.5,0.8,1.0)*max(shim,0.0)*0.05;
 float spark=hash(floor(vUv*vec2(120.,80.)))>0.985?1.0:0.0;
 col+=vec3(0.8,0.95,1.0)*spark*(0.4+0.6*sin(uTime*6.+hash(floor(vUv*80.))*30.))*infl;
 col+=vec3(0.3,0.6,0.9)*infl*0.10;
 col=(col-0.5)*1.06+0.5;float vig=smoothstep(1.2,0.35,distance(vUv,vec2(.5)));col*=0.8+0.2*vig;
 col+=(hash(vUv*950.+uTime)-.5)*0.04;gl_FragColor=vec4(col,1.);}`;
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,fragmentShader:frag});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
new THREE.TextureLoader().load('set_seafood.webp',t=>{t.minFilter=t.magFilter=THREE.LinearFilter;U.uTex.value=t;U.uIA.value=t.image.width/t.image.height;var _b=document.getElementById("bgfill");if(_b)_b.style.backgroundImage="url("+t.image.src+")";rs();});
function rs(){const vw=innerWidth,vh=innerHeight,ia=U.uIA.value||1216/832;let w=vw,h=vh;if(vw/vh<ia){w=vw;h=Math.round(vw/ia);}renderer.setSize(w,h);renderer.domElement.style.width=w+"px";renderer.domElement.style.height=h+"px";U.uPA.value=w/h;}addEventListener('resize',rs);rs();
let tx=.5,ty=.5,mx=.5,my=.5,lx=.5,ly=.5;const cur=document.getElementById('cur');
addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});addEventListener('touchstart',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});
const clk=new THREE.Clock();(function l(){requestAnimationFrame(l);mx+=(tx-mx)*.1;my+=(ty-my)*.1;const v=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;U.uMouse.value.set(mx,my);U.uMV.value+=(Math.min(v*10,1)-U.uMV.value)*.12;U.uTime.value=clk.getElapsedTime();renderer.render(scene,camera);})();
</script></body></html>
