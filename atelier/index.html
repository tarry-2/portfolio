<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATELIER — the ritual set</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=Bodoni+Moda:ital,wght@1,400;0,500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#efe7db;cursor:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#2a231c;font-family:"Archivo",sans-serif;font-weight:300}
.ui a{color:inherit;text-decoration:none;pointer-events:auto}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:32px 44px;font-size:12px;letter-spacing:.3em;text-transform:uppercase}.top .grp{display:flex;gap:30px}
.logo{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-family:"Bodoni Moda",serif;font-weight:500;font-size:22px;letter-spacing:.4em}
.center{position:absolute;left:44px;top:50%;transform:translateY(-50%)}
.center h1{font-family:"Bodoni Moda",serif;font-style:italic;font-weight:400;font-size:clamp(46px,8vw,128px);line-height:.92;color:#2a231c}
.center p{margin-top:22px;font-size:13px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}
.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:36px 44px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.75}
.cursor{position:fixed;z-index:20;width:34px;height:34px;border:1px solid rgba(42,35,28,.5);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;transition:width .3s,height .3s}
</style></head><body>
<canvas id="gl"></canvas>
<div class="ui"><div class="logo">ATELIER</div>
<div class="top"><div class="grp"><a href="#">The Set</a><a href="#">Ritual</a></div><div class="grp"><a href="#">Boutique</a><a href="#">Cart (0)</a></div></div>
<div class="center"><h1>the full<br>ritual.</h1><p>6-piece signature set</p></div>
<div class="bottom"><div>Édition N°01 · Complete Care</div><div>Pull the pieces with your cursor</div></div></div>
<div class="cursor" id="cur"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uTex:{value:null},uMouse:{value:new THREE.Vector2(.5,.5)},uMV:{value:0},uTime:{value:0},uPA:{value:1},uIA:{value:1.5}};
const frag=`precision highp float;varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uMouse;uniform float uMV,uTime,uPA,uIA;
float grain(vec2 p){return fract(sin(dot(p,vec2(12.9,78.2)))*43758.5);}
void main(){vec2 uv=vUv;float rp=uPA,ri=uIA;if(rp>ri)uv.y=(uv.y-.5)*(ri/rp)+.5;else uv.x=(uv.x-.5)*(rp/ri)+.5;
 // 3D tilt parallax (whole scene leans away from cursor)
 vec2 tilt=(uMouse-0.5)*0.04;uv-=tilt;
 // magnetic pull: pieces near cursor drift toward it (lens)
 vec2 md=(vUv-uMouse)*vec2(uPA,1.0);float dist=length(md);float pull=smoothstep(0.4,0.0,dist);
 uv-=normalize(vUv-uMouse+1e-4)*pull*0.045*(0.4+uMV*2.5);
 uv.y+=sin(uv.x*7.0+uTime*0.5)*0.0012;
 float ca=pull*0.004;vec3 col;col.r=texture2D(uTex,uv+vec2(ca,0.)).r;col.g=texture2D(uTex,uv).g;col.b=texture2D(uTex,uv-vec2(ca,0.)).b;
 col*=1.0+pull*0.10;col=mix(col,col*vec3(1.03,1.0,0.97),0.3);
 float vig=smoothstep(1.25,0.4,distance(vUv,vec2(.5)));col*=0.86+0.14*vig;
 col+=(grain(vUv*vec2(900.,560.)+uTime)-.5)*0.03;gl_FragColor=vec4(col,1.);}`;
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,fragmentShader:frag});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
new THREE.TextureLoader().load('set_cosmetic.webp',t=>{t.minFilter=t.magFilter=THREE.LinearFilter;U.uTex.value=t;U.uIA.value=t.image.width/t.image.height;});
function rs(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);U.uPA.value=w/h;}addEventListener('resize',rs);rs();
let tx=.5,ty=.5,mx=.5,my=.5,lx=.5,ly=.5;const cur=document.getElementById('cur');
addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
const clk=new THREE.Clock();(function l(){requestAnimationFrame(l);mx+=(tx-mx)*.07;my+=(ty-my)*.07;const v=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;U.uMouse.value.set(mx,my);U.uMV.value+=(Math.min(v*8,1)-U.uMV.value)*.1;U.uTime.value=clk.getElapsedTime();renderer.render(scene,camera);})();
</script></body></html>
