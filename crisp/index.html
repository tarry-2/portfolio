<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRISP — too good</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden;background:#0a1418;cursor:none}
.bgfill{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:blur(34px) brightness(.5) saturate(1.1);transform:scale(1.15)}#gl{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1;display:block}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff;font-family:"Archivo",sans-serif}
.ui a{color:inherit;text-decoration:none;pointer-events:auto}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:30px 44px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:700}.top .grp{display:flex;gap:28px}
.logo{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-family:"Archivo Black",sans-serif;font-size:24px;letter-spacing:.22em;color:#ffd23b;text-shadow:0 0 24px rgba(255,200,40,.5)}
.center{position:absolute;left:44px;bottom:116px;mix-blend-mode:screen}
.center h1{font-family:"Archivo Black",sans-serif;font-size:clamp(56px,12vw,200px);line-height:.82;text-transform:uppercase}
.center h1 span{color:#ffd23b}
.tagline{position:absolute;left:44px;bottom:80px;font-weight:700;font-size:12px;letter-spacing:.34em;text-transform:uppercase;opacity:.92}
.bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:32px 44px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:700;opacity:.9}
.cursor{position:fixed;z-index:20;width:12px;height:12px;border-radius:50%;background:#ffd23b;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 26px 7px rgba(255,200,40,.6)}
</style></head><body>
<div class="bgfill" id="bgfill"></div><canvas id="gl"></canvas>
<div class="ui"><div class="logo">CRISP</div>
<div class="top"><div class="grp"><a href="#">Menu</a><a href="#">Deals</a></div><div class="grp"><a href="#">Locations</a><a href="#">Order</a></div></div>
<div class="center"><h1>so<br><span>crispy.</span></h1></div>
<div class="tagline">fried fresh · every single hour</div>
<div class="bottom"><div>Combo N°01 · Double Crunch</div><div>Move — make it pop</div></div></div>
<div class="cursor" id="cur"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U={uTex:{value:null},uMouse:{value:new THREE.Vector2(.5,.5)},uMV:{value:0},uTime:{value:0},uPA:{value:1},uIA:{value:1.5}};
const frag=`precision highp float;varying vec2 vUv;uniform sampler2D uTex;uniform vec2 uMouse;uniform float uMV,uTime,uPA,uIA;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
void main(){vec2 uv=vUv;float rp=uPA,ri=uIA;if(rp>ri)uv.y=(uv.y-.5)*(ri/rp)+.5;else uv.x=(uv.x-.5)*(rp/ri)+.5;
 vec2 md=(vUv-uMouse)*vec2(uPA,1.0);float dist=length(md);float infl=smoothstep(0.32,0.,dist);
 // bouncy pop bulge at cursor with rhythmic pulse
 float pulse=0.5+0.5*sin(uTime*4.5);
 float pop=infl*(0.7+0.3*pulse)*(0.5+uMV*2.5);
 uv-=normalize(vUv-uMouse+1e-4)*pop*0.05;
 // whole scene gentle bounce
 uv.y+=sin(uTime*3.0)*0.002;
 vec3 col=texture2D(uTex,uv).rgb;
 // punchy pop color flash near cursor
 col+=vec3(1.0,0.75,0.1)*pop*0.20;
 col=(col-0.5)*1.16+0.5;col=mix(col,col*vec3(1.08,1.02,0.92),0.4);
 // saturate
 float l=dot(col,vec3(.299,.587,.114));col=mix(vec3(l),col,1.25);
 float vig=smoothstep(1.3,0.3,distance(vUv,vec2(.5)));col*=0.8+0.2*vig;
 col+=(hash(vUv*1000.+uTime)-.5)*0.04;gl_FragColor=vec4(col,1.);}`;
const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}`,fragmentShader:frag});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
new THREE.TextureLoader().load('set_fastfood.webp',t=>{t.minFilter=t.magFilter=THREE.LinearFilter;U.uTex.value=t;U.uIA.value=t.image.width/t.image.height;var _b=document.getElementById("bgfill");if(_b)_b.style.backgroundImage="url("+t.image.src+")";rs();});
function rs(){const vw=innerWidth,vh=innerHeight,ia=U.uIA.value||1216/832;let w=vw,h=vh;if(vw/vh<ia){w=vw;h=Math.round(vw/ia);}renderer.setSize(w,h);renderer.domElement.style.width=w+"px";renderer.domElement.style.height=h+"px";U.uPA.value=w/h;}addEventListener('resize',rs);rs();
let tx=.5,ty=.5,mx=.5,my=.5,lx=.5,ly=.5;const cur=document.getElementById('cur');
addEventListener('mousemove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
addEventListener('touchmove',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});addEventListener('touchstart',e=>{const t=e.touches[0];if(!t)return;tx=t.clientX/innerWidth;ty=1-t.clientY/innerHeight;cur.style.left=t.clientX+'px';cur.style.top=t.clientY+'px';},{passive:true});
const clk=new THREE.Clock();(function l(){requestAnimationFrame(l);mx+=(tx-mx)*.11;my+=(ty-my)*.11;const v=Math.hypot(mx-lx,my-ly);lx=mx;ly=my;U.uMouse.value.set(mx,my);U.uMV.value+=(Math.min(v*10,1)-U.uMV.value)*.12;U.uTime.value=clk.getElapsedTime();renderer.render(scene,camera);})();
</script></body></html>
